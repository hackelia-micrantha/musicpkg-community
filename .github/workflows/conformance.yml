name: Public conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    # Public PR code must never run on a privileged/self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify Rust toolchain
        run: rustc --version && cargo --version && cargo fmt --version && cargo clippy --version
      - name: Run public deterministic conformance gate
        run: ./ci/check
